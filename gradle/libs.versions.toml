[versions]
jakarta-xml-ws-api = "4.0.3"
jaxws = "4.0.5"
junit = "6.1.3"
lombok = "1.18.48"

[libraries]
jakarta-xml-ws-api = { module = "jakarta.xml.ws:jakarta.xml.ws-api", version.ref = "jakarta-xml-ws-api" }
jaxws-rt = { module = "com.sun.xml.ws:jaxws-rt", version.ref = "jaxws" }
jaxws-tools = { module = "com.sun.xml.ws:jaxws-tools", version.ref = "jaxws" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }

[plugins]
lombok = { id = "io.freefair.lombok", version = "9.8.2" }
maven-publish = { id = "com.vanniktech.maven.publish", version = "0.37.0" }
spotless = { id = "com.diffplug.spotless", version = "8.10.4" }
